<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Finanze</title>
  
  <!-- Icona App -->
  <link rel="apple-touch-icon" href="icona.png">
  <link rel="icon" type="image/png" href="icona.png">

  <!-- Tailwind CSS per la grafica -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js per i grafici -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Effetto sfocatura per la privacy */
    .blur-value {
      filter: blur(6px);
      user-select: none;
      transition: filter 0.2s ease-in-out;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-12">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-md flex flex-col justify-between">
    <div>
      <!-- Header -->
      <header class="bg-indigo-600 text-white p-4 flex justify-between items-center shadow">
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-wallet"></i> Le Mie Finanze
        </h1>
        <span class="text-xs bg-indigo-500 px-2 py-1 rounded-full font-medium">Locale & Privato</span>
      </header>

      <!-- Card Saldo e Resoconto -->
      <div class="p-4 bg-indigo-50">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-indigo-100">
          
          <!-- Sezione Saldo e Tasto Occhio -->
          <div class="flex justify-between items-start mb-3 border-b border-gray-100 pb-3">
            <div>
              <p class="text-xs text-gray-500 uppercase tracking-wide font-semibold">Saldo Totale (Complessivo)</p>
              <p id="total-balance" class="text-2xl font-black text-indigo-700 mt-0.5 blur-value">€ 0.00</p>
            </div>
            <button id="toggle-privacy-btn" onclick="togglePrivacy()" class="text-indigo-600 hover:text-indigo-800 p-2 rounded-lg bg-indigo-50 hover:bg-indigo-100 transition" title="Nascondi/Mostra Saldi">
              <i id="privacy-icon" class="fa-solid fa-eye-slash text-lg"></i>
            </button>
          </div>

          <!-- Filtro Mese e Saldo Mensile -->
          <div class="mb-3">
            <div class="flex justify-between items-center mb-1">
              <label for="month-filter" class="text-xs font-semibold text-gray-500 uppercase">Seleziona Mese:</label>
              <span class="text-xs font-medium text-gray-500">Saldo Mese: <strong id="month-balance" class="text-gray-800 blur-value">€ 0.00</strong></span>
            </div>
            <input type="month" id="month-filter" onchange="renderApp()" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>

          <!-- Entrate e Uscite Mensili -->
          <div class="grid grid-cols-2 gap-2 pt-2 text-center border-t border-gray-100">
            <div class="bg-green-50 p-2 rounded-lg">
              <p class="text-xs text-green-700 font-medium">Entrate Mese</p>
              <p id="month-income" class="text-sm font-bold text-green-600 blur-value">€ 0.00</p>
            </div>
            <div class="bg-red-50 p-2 rounded-lg">
              <p class="text-xs text-red-700 font-medium">Uscite Mese</p>
              <p id="month-expense" class="text-sm font-bold text-red-600 blur-value">€ 0.00</p>
            </div>
          </div>

        </div>
      </div>

      <!-- Form Inserimento Spesa/Entrata -->
      <div class="p-4 border-b border-gray-200">
        <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-1">
          <i class="fa-solid fa-plus-circle text-indigo-600"></i> Nuova Transazione
        </h2>
        <form id="transaction-form" onsubmit="addTransaction(event)" class="space-y-3">
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Tipo</label>
              <select id="type" onchange="updateCategories()" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
                <option value="uscita">Uscita 🔴</option>
                <option value="entrata">Entrata 🟢</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Importo (€)</label>
              <input type="number" id="amount" step="0.01" min="0.01" required placeholder="0.00" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Data</label>
              <input type="date" id="date" required class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
            </div>
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Categoria</label>
              <select id="category" onchange="updateSubcategories()" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
                <!-- Dinamico -->
              </select>
            </div>
          </div>

          <div id="subcategory-container">
            <label class="block text-xs text-gray-600 font-medium mb-1">Sottocategoria</label>
            <select id="subcategory" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
              <!-- Dinamico -->
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-600 font-medium mb-1">Note (opzionale)</label>
            <input type="text" id="note" placeholder="Es. Cena di lavoro, regalo..." class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
          </div>

          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-check"></i> Salva Transazione
          </button>
        </form>
      </div>

      <!-- Sezione Grafico e Analisi -->
      <div class="p-4 border-b border-gray-200">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-sm font-bold text-gray-700 flex items-center gap-1">
            <i class="fa-solid fa-chart-pie text-indigo-600"></i> Analisi Spese Mese
          </h2>
          <button onclick="exportCSV()" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded border border-gray-300 flex items-center gap-1">
            <i class="fa-solid fa-file-csv text-green-600"></i> Esporta CSV
          </button>
        </div>
        <div class="w-full max-w-[240px] mx-auto py-2">
          <canvas id="expenses-chart"></canvas>
        </div>
      </div>

      <!-- Lista Transazioni del Mese -->
      <div class="p-4">
        <h2 class="text-sm font-bold text-gray-700 mb-3 flex items-center gap-1">
          <i class="fa-solid fa-list text-indigo-600"></i> Movimenti del Mese
        </h2>
        <div id="transaction-list" class="space-y-2">
          <!-- Transazioni inserite dinamicamente -->
        </div>
      </div>
    </div>

    <!-- Modal Modifica Transazione -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-xl p-4 w-full max-w-sm shadow-xl space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h3 class="font-bold text-gray-800">Modifica Movimento</h3>
          <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form id="edit-form" onsubmit="saveEdit(event)" class="space-y-3">
          <input type="hidden" id="edit-id">
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Tipo</label>
              <select id="edit-type" onchange="updateEditCategories()" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
                <option value="uscita">Uscita 🔴</option>
                <option value="entrata">Entrata 🟢</option>
              </select>
            </div>
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Importo (€)</label>
              <input type="number" id="edit-amount" step="0.01" min="0.01" required class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Data</label>
              <input type="date" id="edit-date" required class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
            </div>
            <div>
              <label class="block text-xs text-gray-600 font-medium mb-1">Categoria</label>
              <select id="edit-category" onchange="updateEditSubcategories()" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
              </select>
            </div>
          </div>

          <div id="edit-subcategory-container">
            <label class="block text-xs text-gray-600 font-medium mb-1">Sottocategoria</label>
            <select id="edit-subcategory" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-600 font-medium mb-1">Note</label>
            <input type="text" id="edit-note" class="w-full bg-gray-50 border border-gray-300 text-sm rounded-lg p-2">
          </div>

          <div class="flex gap-2 pt-2">
            <button type="button" onclick="closeEditModal()" class="w-1/2 bg-gray-200 text-gray-700 py-2 rounded-lg font-medium text-sm">Annulla</button>
            <button type="submit" class="w-1/2 bg-indigo-600 text-white py-2 rounded-lg font-medium text-sm">Salva Modifiche</button>
          </div>
        </form>
      </div>
    </div>

  </div>

  <!-- JavaScript Logica -->
  <script>
    // Nuova Struttura Categorie (Servizi e Famiglia rimossi; aggiunti Abbonamenti, Sanità e Lavoro)
    const categoriesConfig = {
      uscita: {
        "Casa": ["Affitto/Mutuo", "Bollette", "Spesa Alimentare", "Manutenzione", "Altro"],
        "Macchina": ["Carburante", "Assicurazione", "Bollo", "Manutenzione/Tagliando", "Lavaggio", "Autostrada/Parcheggi", "Altro"],
        "Trasporti Pubblici": ["Biglietti", "Abbonamento Mezzi"],
        "Svago & Tempo Libero": ["Ristoranti/Bar", "Cinema/Teatro", "Viaggi/Vacanze", "Hobby", "Sport"],
        "Abbonamenti": ["Streaming (Netflix/Spotify)", "Software/App", "Palestra", "Altro"],
        "Sanità": ["Farmacia", "Visite Mediche", "Esami", "Altro"],
        "Lavoro": ["Strumentazione", "Formazione", "Cancelleria", "Altro"],
        "Shopping & Personale": ["Abbigliamento", "Cura Personale", "Elettronica", "Altro"],
        "Varie": ["Generico"]
      },
      entrata: {
        "Stipendio/Lavoro": ["Stipendio Fisso", "Bonus/Extra", "Lavoro Autonomo"],
        "Investimenti": ["Dividendi", "Interessi", "Plusvalenze"],
        "Regali/Rimborsi": ["Regali", "Rimborsi Spese"],
        "Altro": ["Entrata Generica"]
      }
    };

    let transactions = JSON.parse(localStorage.getItem('finanze_transactions')) || [];
    let isPrivate = localStorage.getItem('finanze_privacy') !== 'false'; // Di default true (annebbiato)
    let myChart = null;

    // Imposta Mese Corrente come predefinito
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      document.getElementById('month-filter').value = `${yyyy}-${mm}`;
      document.getElementById('date').value = today.toISOString().split('T')[0];
      
      updateCategories();
      applyPrivacyUI();
      renderApp();
    });

    // Gestione Privacy (Occhio)
    function togglePrivacy() {
      isPrivate = !isPrivate;
      localStorage.setItem('finanze_privacy', isPrivate);
      applyPrivacyUI();
    }

    function applyPrivacyUI() {
      const elements = ['total-balance', 'month-balance', 'month-income', 'month-expense'];
      const icon = document.getElementById('privacy-icon');
      
      elements.forEach(id => {
        const el = document.getElementById(id);
        if (isPrivate) {
          el.classList.add('blur-value');
        } else {
          el.classList.remove('blur-value');
        }
      });

      if (isPrivate) {
        icon.className = 'fa-solid fa-eye-slash text-lg';
      } else {
        icon.className = 'fa-solid fa-eye text-lg';
      }
    }

    // Gestione Categorie Form Principale
    function updateCategories() {
      const type = document.getElementById('type').value;
      const catSelect = document.getElementById('category');
      catSelect.innerHTML = '';

      Object.keys(categoriesConfig[type]).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });

      updateSubcategories();
    }

    function updateSubcategories() {
      const type = document.getElementById('type').value;
      const cat = document.getElementById('category').value;
      const subSelect = document.getElementById('subcategory');
      const subContainer = document.getElementById('subcategory-container');
      
      subSelect.innerHTML = '';
      const subcats = categoriesConfig[type][cat] || [];

      if (subcats.length > 0) {
        subContainer.style.display = 'block';
        subcats.forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          subSelect.appendChild(opt);
        });
      } else {
        subContainer.style.display = 'none';
      }
    }

    // Aggiunta Transazione
    function addTransaction(e) {
      e.preventDefault();
      
      const newTransaction = {
        id: Date.now(),
        type: document.getElementById('type').value,
        amount: parseFloat(document.getElementById('amount').value),
        date: document.getElementById('date').value,
        category: document.getElementById('category').value,
        subcategory: document.getElementById('subcategory').value || '',
        note: document.getElementById('note').value.trim()
      };

      transactions.unshift(newTransaction);
      saveData();
      
      document.getElementById('transaction-form').reset();
      document.getElementById('date').value = new Date().toISOString().split('T')[0];
      updateCategories();
      renderApp();
    }

    // Salvataggio su LocalStorage
    function saveData() {
      localStorage.setItem('finanze_transactions', JSON.stringify(transactions));
    }

    // Render Generale
    function renderApp() {
      const selectedMonth = document.getElementById('month-filter').value; // YYYY-MM

      // 1. Calcolo Saldo Totale Complessivo (Tutte le transazioni di sempre)
      const totalBalance = transactions.reduce((acc, curr) => {
        return curr.type === 'entrata' ? acc + curr.amount : acc - curr.amount;
      }, 0);
      document.getElementById('total-balance').textContent = `€ ${totalBalance.toFixed(2)}`;

      // 2. Filtro Transazioni Mese Selezionato
      const monthTransactions = transactions.filter(t => t.date.startsWith(selectedMonth));

      // 3. Calcolo Totali Mese
      let monthIncome = 0;
      let monthExpense = 0;

      monthTransactions.forEach(t => {
        if (t.type === 'entrata') monthIncome += t.amount;
        if (t.type === 'uscita') monthExpense += t.amount;
      });

      const monthBalance = monthIncome - monthExpense;

      document.getElementById('month-balance').textContent = `€ ${monthBalance.toFixed(2)}`;
      document.getElementById('month-income').textContent = `+€ ${monthIncome.toFixed(2)}`;
      document.getElementById('month-expense').textContent = `-€ ${monthExpense.toFixed(2)}`;

      // 4. Render Lista
      renderList(monthTransactions);

      // 5. Render Grafico Uscite
      renderChart(monthTransactions);
    }

    // Render Lista
    function renderList(list) {
      const listContainer = document.getElementById('transaction-list');
      listContainer.innerHTML = '';

      if (list.length === 0) {
        listContainer.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">Nessun movimento in questo mese.</p>';
        return;
      }

      list.forEach(t => {
        const isIncome = t.type === 'entrata';
        const card = document.createElement('div');
        card.className = `p-3 rounded-lg border flex justify-between items-center bg-white ${isIncome ? 'border-green-200' : 'border-red-200'}`;
        
        card.innerHTML = `
          <div class="flex-1 pr-2">
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold px-2 py-0.5 rounded ${isIncome ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                ${t.category}
              </span>
              ${t.subcategory ? `<span class="text-xs text-gray-500">• ${t.subcategory}</span>` : ''}
            </div>
            <p class="text-xs text-gray-400 mt-1">${t.date} ${t.note ? `<span class="text-gray-600 font-medium">(${t.note})</span>` : ''}</p>
          </div>
          <div class="text-right flex items-center gap-2">
            <span class="font-bold text-sm ${isIncome ? 'text-green-600' : 'text-red-600'}">
              ${isIncome ? '+' : '-'}€ ${t.amount.toFixed(2)}
            </span>
            <button onclick="openEditModal(${t.id})" class="text-gray-400 hover:text-indigo-600 p-1">
              <i class="fa-solid fa-pen text-xs"></i>
            </button>
            <button onclick="deleteTransaction(${t.id})" class="text-gray-400 hover:text-red-600 p-1">
              <i class="fa-solid fa-trash text-xs"></i>
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // Render Grafico a Torta
    function renderChart(monthList) {
      const expenses = monthList.filter(t => t.type === 'uscita');
      const categoryTotals = {};

      expenses.forEach(e => {
        categoryTotals[e.category] = (categoryTotals[e.category] || 0) + e.amount;
      });

      const labels = Object.keys(categoryTotals);
      const data = Object.values(categoryTotals);

      const ctx = document.getElementById('expenses-chart').getContext('2d');

      if (myChart) {
        myChart.destroy();
      }

      if (labels.length === 0) {
        return;
      }

      myChart = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: [
              '#f87171', '#3b82f6', '#fbbf24', '#34d399', '#a78bfa',
              '#f472b6', '#38bdf8', '#fb923c', '#4ade80', '#c084fc'
            ]
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { boxWidth: 12, font: { size: 10 } }
            }
          }
        }
      });
    }

    // Eliminazione Movimento
    function deleteTransaction(id) {
      if (confirm("Vuoi davvero eliminare questa transazione?")) {
        transactions = transactions.filter(t => t.id !== id);
        saveData();
        renderApp();
      }
    }

    // Gestione Modifica (Modal)
    function openEditModal(id) {
      const t = transactions.find(item => item.id === id);
      if (!t) return;

      document.getElementById('edit-id').value = t.id;
      document.getElementById('edit-type').value = t.type;
      document.getElementById('edit-amount').value = t.amount;
      document.getElementById('edit-date').value = t.date;
      document.getElementById('edit-note').value = t.note || '';

      updateEditCategories();
      document.getElementById('edit-category').value = t.category;
      updateEditSubcategories();
      if (t.subcategory) {
        document.getElementById('edit-subcategory').value = t.subcategory;
      }

      document.getElementById('edit-modal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.add('hidden');
    }

    function updateEditCategories() {
      const type = document.getElementById('edit-type').value;
      const catSelect = document.getElementById('edit-category');
      catSelect.innerHTML = '';

      Object.keys(categoriesConfig[type]).forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });

      updateEditSubcategories();
    }

    function updateEditSubcategories() {
      const type = document.getElementById('edit-type').value;
      const cat = document.getElementById('edit-category').value;
      const subSelect = document.getElementById('edit-subcategory');
      const subContainer = document.getElementById('edit-subcategory-container');
      
      subSelect.innerHTML = '';
      const subcats = categoriesConfig[type][cat] || [];

      if (subcats.length > 0) {
        subContainer.style.display = 'block';
        subcats.forEach(sub => {
          const opt = document.createElement('option');
          opt.value = sub;
          opt.textContent = sub;
          subSelect.appendChild(opt);
        });
      } else {
        subContainer.style.display = 'none';
      }
    }

    function saveEdit(e) {
      e.preventDefault();
      const id = parseInt(document.getElementById('edit-id').value);
      
      const index = transactions.findIndex(t => t.id === id);
      if (index !== -1) {
        transactions[index] = {
          id: id,
          type: document.getElementById('edit-type').value,
          amount: parseFloat(document.getElementById('edit-amount').value),
          date: document.getElementById('edit-date').value,
          category: document.getElementById('edit-category').value,
          subcategory: document.getElementById('edit-subcategory').value || '',
          note: document.getElementById('edit-note').value.trim()
        };

        saveData();
        closeEditModal();
        renderApp();
      }
    }

    // Esportazione CSV Mese Attivo
    function exportCSV() {
      const selectedMonth = document.getElementById('month-filter').value;
      const monthTransactions = transactions.filter(t => t.date.startsWith(selectedMonth));

      if (monthTransactions.length === 0) {
        alert("Nessuna transazione da esportare per questo mese.");
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,Data,Tipo,Categoria,Sottocategoria,Importo,Note\n";

      monthTransactions.forEach(t => {
        const row = [
          t.date,
          t.type,
          `"${t.category}"`,
          `"${t.subcategory || ''}"`,
          t.amount.toFixed(2),
          `"${t.note || ''}"`
        ].join(",");
        csvContent += row + "\n";
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Finanze_${selectedMonth}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
